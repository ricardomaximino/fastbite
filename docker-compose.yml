# Local development stack. Production should run the migration job separately.
x-database: &database
  DB_URL: jdbc:postgresql://postgres:5432/brasatech
  DB_USER: brasatech
  DB_PASSWORD: brasatech
  DB_DRIVER: org.postgresql.Driver
  HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: brasatech
      POSTGRES_USER: brasatech
      POSTGRES_PASSWORD: brasatech
    ports:
      - "${FASTBITE_DB_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brasatech -d brasatech"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Catches local outgoing email at http://localhost:8025.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${FASTBITE_SMTP_PORT:-1025}:1025"
      - "${FASTBITE_MAIL_UI_PORT:-8025}:8025"

  fastbite:
    build:
      context: .
      dockerfile: docker/Dockerfile-Multi-Stage
    image: ricardomaximino/fastbite-native:latest
    ports:
      - "${FASTBITE_PORT:-8080}:8080"
    environment:
      <<: *database
      SPRING_PROFILES_ACTIVE: jpa
      MIGRATION_MODE: migrate
      H2_CONSOLE_ENABLED: "false"
      IMAGE_UPLOAD_DIR: /storage/images
      FASTBITE_PUBLIC_URL: http://localhost:${FASTBITE_PORT:-8080}
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_AUTH: "false"
      SMTP_STARTTLS: "false"
    volumes:
      - fastbite-storage:/storage
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started

volumes:
  postgres-data:
  fastbite-storage:
