<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FastBite - Create Your Restaurant Account</title>
    <link href="/webjars/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="/webjars/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="login-body">
    <div class="login-card">
        <div class="login-logo">
            <i class="fas fa-store"></i>
        </div>
        <h3 class="login-title">Register Restaurant</h3>

        <form th:action="@{/signup}" method="post">
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <span th:text="${error}">An error occurred.</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
                <span th:text="${success}">Tenant registered successfully.</span>
                <div class="mt-2" th:if="${subdomainUrl != null}">
                    <a th:href="${subdomainUrl}" class="btn btn-sm btn-success text-white px-3 py-1 rounded-pill mt-1">Go to Restaurant Dashboard</a>
                </div>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <div class="mb-3">
                <label class="form-label text-white small">Restaurant URL Prefix</label>
                <div class="input-group">
                    <span class="input-group-text bg-transparent border-0"><i class="fas fa-globe text-muted"></i></span>
                    <input type="text" name="tenantId" class="form-control" placeholder="restaurant-url-prefix" required autofocus pattern="^[a-zA-Z0-9]+$" title="Only alphanumeric characters allowed">
                </div>
                <div class="form-text text-muted-light small text-white-50">Example: myburger (Access via /myburger/menu)</div>
            </div>

            <div class="mb-3">
                <label class="form-label text-white small">Full Name</label>
                <div class="input-group">
                    <span class="input-group-text bg-transparent border-0"><i class="fas fa-id-card text-muted"></i></span>
                    <input type="text" name="fullName" class="form-control" placeholder="Owner Name" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label text-white small">Admin Username</label>
                <div class="input-group">
                    <span class="input-group-text bg-transparent border-0"><i class="fas fa-user text-muted"></i></span>
                    <input type="text" name="username" class="form-control" placeholder="Admin Username" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label text-white small">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-transparent border-0"><i class="fas fa-lock text-muted"></i></span>
                    <input type="password" name="password" class="form-control" placeholder="Password" required>
                </div>
            </div>

            <button type="submit" class="btn-login mt-3">Register & Provision</button>

            <div class="back-link">
                <a th:href="${tenantId != null ? '/' + tenantId + '/menu' : '/'}" href="/"><i class="fas fa-arrow-left me-1"></i> <span>Back to Main Menu</span></a>
            </div>
        </form>
    </div>

    <script src="/webjars/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
</body>

</html>
