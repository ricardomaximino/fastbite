<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{page.payment.title}">Payment Method - FastBite</title>
    <link href="/webjars/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="/webjars/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">

</head>

<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" th:href="${tenantId != null && !tenantId.isEmpty()} ? @{/{tenantId}/menu(tenantId=${tenantId})} : '/menu'"><i class="fas fa-hamburger"></i> <span
                    th:text="#{logo.title}">FastBite</span></a>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container mt-4 mb-5">
        <!-- Step Indicator -->
        <div class="step-indicator">
            <div class="step completed">1</div>
            <div class="step completed">2</div>
            <div class="step completed">3</div>
            <div class="step active">4</div>
        </div>

        <!-- Payment Section -->
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="confirmation-card">
                    <h3 class="mb-4" th:text="#{label.select.payment.method}">Select Payment Method</h3>

                    <form id="paymentForm" action="/process-payment" method="POST">
                        <!-- Payment Options - Logo Style -->
                        <div class="row g-3 mb-4">
                            <!-- Stripe Card Payment -->
                            <div class="col-md-4">
                                <input type="radio" class="btn-check" name="paymentMethod" id="local" value="local"
                                    checked>
                                <label class="card product-card h-100 text-center p-4" for="local"
                                    style="cursor: pointer;">
                                    <div class="mb-3">
                                        <i class="fa fa-credit-card fa-2x text-primary"></i>
                                    </div>
                                    <h6 class="fw-bold" th:text="#{label.payment.card} + ' | ' + #{label.payment.cash}">
                                        Card | Money</h6>
                                    <small class="text-muted" th:text="#{label.payment.counter.desc}">At the store
                                        counter</small>
                                </label>
                            </div>

                            <!-- PayPal -->
                            <div class="col-md-4">
                                <input type="radio" class="btn-check" name="paymentMethod" id="paypal" value="paypal">
                                <label class="card product-card h-100 text-center p-4" for="paypal"
                                    style="cursor: pointer;">
                                    <div class="mb-3">
                                        <i class="fab fa-paypal fa-4x" style="color: #003087;"></i>
                                    </div>
                                    <h6 class="fw-bold">PayPal</h6>
                                    <small class="text-muted" th:text="#{label.payment.fast.secure}">Fast &
                                        Secure</small>
                                </label>
                            </div>

                            <!-- Stripe Checkout -->
                            <div class="col-md-4">
                                <input type="radio" class="btn-check" name="paymentMethod" id="stripe"
                                    value="stripe-checkout">
                                <label class="card product-card h-100 text-center p-4" for="stripe"
                                    style="cursor: pointer;">
                                    <div class="mb-3">
                                        <i class="fab fa-stripe fa-4x" style="color: #635bff;"></i>
                                    </div>
                                    <h6 class="fw-bold">Stripe Checkout</h6>
                                    <small class="text-muted" th:text="#{label.payment.mobile.wallets}">Apple Pay,
                                        Google Pay</small>
                                </label>
                            </div>
                        </div>

                        <!-- Bill Splitting Options (F-21) -->
                        <div class="card mb-4 border-0 bg-light rounded-4 p-3 shadow-sm">
                            <h6 class="fw-bold mb-2 text-dark"><i class="fas fa-users-slash me-2 text-primary"></i>Split Bill Option</h6>
                            <div class="row g-2 align-items-center">
                                <div class="col-md-6">
                                    <select id="splitBillMode" class="form-select border-secondary rounded-pill" onchange="updateBillSplit()">
                                        <option value="full" selected>Pay Full Bill (1 Person)</option>
                                        <option value="equal2">Equal Split (2 Guests)</option>
                                        <option value="equal3">Equal Split (3 Guests)</option>
                                        <option value="equal4">Equal Split (4 Guests)</option>
                                        <option value="equal5">Equal Split (5 Guests)</option>
                                    </select>
                                </div>
                                <div class="col-md-6 text-md-end">
                                    <span id="splitShareDisplay" class="badge bg-primary fs-6 px-3 py-2 rounded-pill">Your Share: $<span id="shareAmount" th:text="${#numbers.formatDecimal(order.total, 1, 2)}">0.00</span></span>
                                </div>
                            </div>
                        </div>

                        <!-- 1-Tap Tipping Presets (F-21) -->
                        <div class="card mb-4 border-0 bg-light rounded-4 p-3 shadow-sm">
                            <h6 class="fw-bold mb-2 text-dark"><i class="fas fa-heart me-2 text-danger"></i>Add Waiter Tip</h6>
                            <div class="d-flex flex-wrap gap-2 mb-2">
                                <button type="button" class="btn btn-outline-secondary btn-sm rounded-pill tip-chip active" onclick="selectTip(0, this)">No Tip</button>
                                <button type="button" class="btn btn-outline-danger btn-sm rounded-pill tip-chip" onclick="selectTip(10, this)">10% ($<span id="tip10">0.00</span>)</button>
                                <button type="button" class="btn btn-outline-danger btn-sm rounded-pill tip-chip" onclick="selectTip(15, this)">15% ($<span id="tip15">0.00</span>)</button>
                                <button type="button" class="btn btn-outline-danger btn-sm rounded-pill tip-chip" onclick="selectTip(20, this)">20% ($<span id="tip20">0.00</span>)</button>
                            </div>
                        </div>

                        <!-- Order Summary -->
                        <div class="order-summary mb-4">
                            <h5 class="mb-3"><i class="fas fa-receipt me-2"></i><span
                                    th:text="#{label.order.summary}">Order Summary</span></h5>
                            <div th:each="item : ${order.itemList}">
                                <div class="d-flex justify-content-between mb-2">
                                    <span th:text="${item.name}">Coca Cola x 1 (Large)</span>
                                    <span class="badge bg-primary rounded-pill h5 mb-0"
                                        th:text="${#numbers.formatDecimal(item.price, 1, 2)}">$5.99</span>
                                </div>
                            </div>
                            <div class="d-flex justify-content-between mb-2">
                                <span th:text="#{label.subtotal} + ':'">Subtotal:</span>
                                <span th:text="${#numbers.formatDecimal(order.subtotal, 1, 2)}">$5.99</span>
                            </div>
                            <div th:if="${order.tax > 0}" class="d-flex justify-content-between mb-2">
                                <span th:text="#{label.tax} + ' (' + ${order.tax} + '%):'">Tax (10%):</span>
                                <span th:text="${#numbers.formatDecimal(order.taxAmount, 1, 2)}">$0.60</span>
                            </div>
                            <div id="tipRow" class="d-flex justify-content-between mb-2" style="display: none;">
                                <span>Tip (<span id="selectedTipPercent">0</span>%):</span>
                                <span class="text-danger fw-bold">$<span id="tipAmountDisplay">0.00</span></span>
                            </div>
                            <hr>
                            <div class="d-flex justify-content-between fw-bold fs-5">
                                <span th:text="#{label.total} + ':'">Total:</span>
                                <span>$<span id="displayGrandTotal" th:text="${#numbers.formatDecimal(order.total, 1, 2)}">6.59</span></span>
                            </div>
                        </div>

                        <!-- Security Badge -->
                        <div class="alert alert-success text-center mb-4">
                            <i class="fas fa-lock me-2"></i>
                            <span th:text="#{message.secure.payment.desc}"><strong>Secure Payment</strong> - Your
                                information is encrypted and secure</span>
                        </div>

                        <!-- Action Buttons -->
                        <div class="text-center">
                            <button type="button" class="btn btn-outline-secondary btn-lg me-3" onclick="goBack()">
                                <i class="fas fa-arrow-left"></i> <span th:text="#{button.back}">Back</span>
                            </button>
                            <button type="submit" class="btn btn-success btn-lg">
                                <i class="fas fa-lock"></i> <span th:text="#{button.proceed.to.payment}">Proceed to
                                    Payment</span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>

    <script>
        // Restore theme preference
        const savedTheme = localStorage.getItem('fastbite-theme') || 'fastfood';
        document.documentElement.setAttribute('data-theme', savedTheme);

        // Add selected styling to payment cards
        document.querySelectorAll('.btn-check').forEach(radio => {
            radio.addEventListener('change', function () {
                // Remove selected styling from all cards
                document.querySelectorAll('.btn-check + label').forEach(label => {
                    label.style.borderColor = '';
                    label.style.backgroundColor = '';
                });

                // Add selected styling to checked card
                if (this.checked) {
                    const label = this.nextElementSibling;
                    // Resolve active theme variables dynamically
                    label.style.borderColor = 'var(--primary-color)';
                    label.style.backgroundColor = 'var(--light-color)';
                }
            });
        });

        // Initialize first option as selected
        document.querySelector('.btn-check').dispatchEvent(new Event('change'));

        // Handle form submission
        document.getElementById('paymentForm').addEventListener('submit', function (e) {
            e.preventDefault();

            const selectedMethod = document.querySelector('input[name="paymentMethod"]:checked').value;
            const submitBtn = this.querySelector('button[type="submit"]');
            const originalText = submitBtn.innerHTML;
            const processingText = '[[#{button.processing}]]';
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> ' + (processingText || 'Processing...');
            submitBtn.disabled = true;

            if (selectedMethod === 'stripe-checkout') {
                const tenantPrefix = getTenantPrefix();
                const tenantId = tenantPrefix ? tenantPrefix.replace('/', '') : '';

                fetch('/api/stripe/create-checkout-session', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        tenantId: tenantId,
                        orderId: '[[${order.id != null ? order.id : ""}]]',
                        amount: '[[${order.total != null ? order.total : 0}]]'
                    })
                })
                .then(res => res.json())
                .then(data => {
                    if (data.checkoutUrl) {
                        window.location.href = data.checkoutUrl;
                    } else {
                        alert(data.error || 'Failed to initiate Stripe Checkout');
                        submitBtn.innerHTML = originalText;
                        submitBtn.disabled = false;
                    }
                })
                .catch(err => {
                    console.error('Stripe Checkout Error:', err);
                    window.location.assign(getTenantPrefix() + '/order-confirmation');
                });
            } else {
                setTimeout(() => {
                    window.location.assign(getTenantPrefix() + '/order-confirmation');
                }, 800);
            }
        });

        function getTenantPrefix() {
            const path = window.location.pathname;
            const segments = path.split('/');
            if (segments.length > 1) {
                const firstSegment = segments[1];
                const reserved = ["signup", "login", "css", "js", "images", "webjars", "stripe", "error", "favicon.ico", "actuator", "api", "counter", "backoffice", "dashboard", "logout", "menu", "select-payment", "order-confirmation", ".well-known", "appspecific"];
                if (firstSegment && !reserved.includes(firstSegment)) {
                    return '/' + firstSegment;
                }
            }
            return '';
        }

        // Go back to confirmation
        function goBack() {
            window.history.back();
        }

        // Tipping & Split Bill JS Logic (F-21)
        let baseSubtotal = parseFloat('[[${order.total != null ? order.total : 0}]]') || 0;
        let currentTipPercent = 0;

        function updateTotals() {
            let tipAmount = (baseSubtotal * currentTipPercent) / 100;
            let grandTotal = baseSubtotal + tipAmount;

            const t10 = document.getElementById('tip10');
            const t15 = document.getElementById('tip15');
            const t20 = document.getElementById('tip20');
            if (t10) t10.innerText = ((baseSubtotal * 10) / 100).toFixed(2);
            if (t15) t15.innerText = ((baseSubtotal * 15) / 100).toFixed(2);
            if (t20) t20.innerText = ((baseSubtotal * 20) / 100).toFixed(2);

            const tipDisplay = document.getElementById('tipAmountDisplay');
            const tipPercentDisplay = document.getElementById('selectedTipPercent');
            const tipRow = document.getElementById('tipRow');
            const grandTotalDisplay = document.getElementById('displayGrandTotal');

            if (tipDisplay) tipDisplay.innerText = tipAmount.toFixed(2);
            if (tipPercentDisplay) tipPercentDisplay.innerText = currentTipPercent;
            if (tipRow) tipRow.style.display = currentTipPercent > 0 ? 'flex' : 'none';
            if (grandTotalDisplay) grandTotalDisplay.innerText = grandTotal.toFixed(2);

            updateBillSplit(grandTotal);
        }

        function selectTip(percent, btnEl) {
            document.querySelectorAll('.tip-chip').forEach(btn => btn.classList.remove('active', 'btn-danger'));
            document.querySelectorAll('.tip-chip').forEach(btn => btn.classList.add('btn-outline-danger'));
            btnEl.classList.remove('btn-outline-danger');
            btnEl.classList.add('active', 'btn-danger');
            currentTipPercent = percent;
            updateTotals();
        }

        function updateBillSplit(totalAmount) {
            let total = totalAmount || (baseSubtotal + (baseSubtotal * currentTipPercent) / 100);
            let selectEl = document.getElementById('splitBillMode');
            let mode = selectEl ? selectEl.value : 'full';
            let guests = 1;
            if (mode.startsWith('equal')) {
                guests = parseInt(mode.replace('equal', ''), 10) || 1;
            }
            let share = total / guests;
            const shareAmountEl = document.getElementById('shareAmount');
            if (shareAmountEl) shareAmountEl.innerText = share.toFixed(2);
        }

        document.addEventListener('DOMContentLoaded', () => {
            updateTotals();
        });
    </script>
</body>

</html>
