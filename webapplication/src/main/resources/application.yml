server.port: 8080

fastbite.protocol: ${PROTOCOL:http}

spring:
  profiles:
    active: jpa
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/fast_bite.db}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    hikari:
      maximum-pool-size: 30
  sql:
    init:
      # Schemas are created by TenantSchemaInitializer; demo content comes from kebab_demo.zip.
      mode: never
  jpa:
    # One database session per service call, not per web request. A request-long session stays on the
    # schema the request started with, so work for another restaurant (Stripe webhooks, the owner
    # console) would silently run in the wrong schema. It also gives connections back sooner.
    open-in-view: false
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: false
    defer-datasource-initialization: true
    properties:
      jakarta.persistence.jdbc.url: ${DB_URL:jdbc:h2:file:./data/fast_bite.db}
      jakarta.persistence.jdbc.user: ${DB_USER:sa}
      jakarta.persistence.jdbc.password: ${DB_PASSWORD:}
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
        temp:
          use_jdbc_metadata_defaults: false
        multi_tenancy: SCHEMA
        # Loads lazy collections (e.g. each product's customizations) in batches instead of one query per row
        default_batch_fetch_size: 50
  session:
    store-type: jdbc
    jdbc:
      initialize-schema: always
  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:true}
      path: /h2-console
  application:
    name: fastbite
  messages:
    basename: i18n/messages
  mail:
    host: smtp.office365.com
    port: 587
    username: info@brasatech.es
    password: BrasaTech!2022
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:user}
    password: ${RABBITMQ_PASSWORD:password}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

company:
  host: https://soberana.brasatech.es
  mail:
    to: ricardo.maximino@brasatech.es
    template:
      mail-validation: email/fastbite-email-validation.html
      product-delivery: email/fastbite-product-delivery.html
    attachment: static/attachments/Test.pdf

logging:
  level:
    root: INFO
    es.brasatech: DEBUG
    org.springframework: INFO

# Internationalization configuration
i18n:
  # Default language for storing entity values
  # All entity text fields (name, description, etc.) are stored in this language
  # Translations for other languages are stored in separate translation tables
  default-language: en

  # Supported locales for translation UI
  # Add or remove languages as needed
  supported-locales:
    - en
    - es
    - pt

# Image upload configuration
image:
  upload:
    # Directory where user-uploaded images will be stored
    # Can be absolute path or relative to application directory
    directory: ${IMAGE_UPLOAD_DIR:uploads/images}
    # Maximum file size (in MB)
    max-file-size: 5
    # Allowed extensions
    allowed-extensions: jpg,jpeg,png,gif,webp

# FastBite custom application settings
fastbite:
  tax:
    # Tax rate percentage applied to orders (e.g. 10.0 for 10%)
    percentage: 10.0
  table:
    # Secret key used for cryptographic table signature generation
    secret: "SuperSecretKeyForTableOrderingSignatures!!!"
  orders:
    # Order numbers restart at 1 at midnight in this time zone
    time-zone: ${ORDERS_TIME_ZONE:Europe/Madrid}

stripe:
  secret:
    key: ${STRIPE_SECRET_KEY:${STRIPE_SECRET_KEY_SANDBOX:}}
  webhook:
    # Signing secret of the Stripe webhook endpoint that calls /api/webhooks/stripe
    secret: ${STRIPE_CONNECT_WEBHOOK_SECRET:${STRIPE_CONNECT_WEBHOOK_SECRET_SANDBOX:}}
  # Order payments of restaurants that have not connected their own Stripe account go to this one.
  # Leave it empty in production to keep those payments on the platform account.
  connected-account: ${STRIPE_CONNECTED_ACCOUNT:}