# Profile: JPA (H2/PostgreSQL/MySQL)
# Uses JPA with relational database
# Default: H2 file-based database (./data/fast_bite.db)
DB_URL: jdbc:h2:file:./data/fast_bite.db
DB_USER: sa
DB_PASSWORD:
DB_DRIVER: org.h2.Driver
HIBERNATE_DIALECT: org.hibernate.dialect.H2Dialect

# For PostgreSQL, use these environment variables:
#DB_URL: jdbc:postgresql://localhost:5432/fast_bite
#DB_USER: myuser
#DB_PASSWORD: secret
#DB_DRIVER: org.postgresql.Driver
#HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect

# For MySQL, use these environment variables:
#DB_URL: jdbc:mysql://localhost:3306/fast_bite
#DB_USER: root
#DB_PASSWORD: password
#DB_DRIVER: com.mysql.cj.jdbc.Driver
#HIBERNATE_DIALECT: org.hibernate.dialect.MySQLDialect

spring:
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/fast_bite.db}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  sql:
    init:
      data-locations: classpath:data-jpa.sql
      mode: always
      continue-on-error: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: false
    defer-datasource-initialization: true
    properties:
      jakarta.persistence.jdbc.url: ${DB_URL:jdbc:h2:file:./data/fast_bite.db}
      jakarta.persistence.jdbc.user: ${DB_USER:sa}
      jakarta.persistence.jdbc.password: ${DB_PASSWORD:}
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
        temp:
          use_jdbc_metadata_defaults: false
  session:
    store-type: jdbc
    jdbc:
      initialize-schema: always
  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:true}
      path: /h2-console